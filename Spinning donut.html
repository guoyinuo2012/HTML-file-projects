<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinning Donut</title>
    <style>
        body {
            background-color: #000;
            color: #ccc;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }
        #donut {
            font-size: 10pt;
            line-height: 8pt;
            white-space: pre;
        }
    </style>
</head>
<body>

    <pre id="donut"></pre>

    <script>
        (function() {
            var pretag = document.getElementById('donut');
            var A = 1, B = 1;

            /**
             * The math behind the donut:
             * It renders a 3D torus using parametric equations:
             * x = (R1 + R2*cos(theta)) * cos(phi)
             * y = (R1 + R2*cos(theta)) * sin(phi)
             * z = R2 * sin(theta)
             * These points are then rotated around the X and Z axes (A and B).
             */
            var asciiframe = function() {
                var b = [];
                var z = [];
                A += 0.07;
                B += 0.03;
                var cA = Math.cos(A), sA = Math.sin(A),
                    cB = Math.cos(B), sB = Math.sin(B);

                // Initialize buffers
                for (var k = 0; k < 1760; k++) {
                    b[k] = k % 80 == 79 ? "\n" : " ";
                    z[k] = 0;
                }

                for (var j = 0; j < 6.28; j += 0.07) { // theta
                    var ct = Math.cos(j), st = Math.sin(j);
                    for (var i = 0; i < 6.28; i += 0.02) { // phi
                        var sp = Math.sin(i), cp = Math.cos(i),
                            h = ct + 2, // R1 + R2*cos(theta)
                            D = 1 / (sp * h * sA + st * cA + 5), // z-buffer / projection
                            t = sp * h * cA - st * sA;

                        var x = Math.floor(40 + 30 * D * (cp * h * cB - t * sB)),
                            y = Math.floor(12 + 15 * D * (cp * h * sB + t * cB)),
                            o = x + 80 * y,
                            N = Math.floor(8 * ((st * sA - sp * ct * cA) * cB - sp * ct * sA - st * cA - cp * ct * sB));

                        if (y < 22 && y >= 0 && x >= 0 && x < 79 && D > z[o]) {
                            z[o] = D;
                            // Characters representing different luminance levels
                            b[o] = ".,-~:;=!*#$@"[N > 0 ? N : 0];
                        }
                    }
                }
                pretag.innerHTML = b.join("");
            };

            setInterval(asciiframe, 50);
        })();
    </script>
</body>
</html>
