<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        github: {
                            dark: '#0d1117',
                            darker: '#010409',
                            light: '#ffffff',
                            gray: '#161b22',
                            border: '#30363d',
                            accent: '#58a6ff',
                            green: '#238636',
                            red: '#da3633'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .dark {
            color-scheme: dark;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .spinner {
            border: 3px solid rgba(88, 166, 255, 0.3);
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen transition-colors duration-300 bg-gray-100 dark:bg-github-darker text-gray-900 dark:text-gray-100">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold flex items-center gap-3">
                <i class="fab fa-github text-github-accent"></i>
                GitHub Finder
            </h1>
            <button id="themeToggle" class="p-2 rounded-lg bg-gray-200 dark:bg-github-gray hover:bg-gray-300 dark:hover:bg-github-border transition-colors duration-200">
                <i class="fas fa-moon dark:hidden"></i>
                <i class="fas fa-sun hidden dark:inline"></i>
            </button>
        </header>

        <!-- Search Section -->
        <div class="mb-8">
            <form id="searchForm" class="flex gap-3">
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Enter GitHub username..." 
                        class="w-full pl-12 pr-4 py-3 rounded-lg border-2 border-gray-300 dark:border-github-border bg-white dark:bg-github-gray focus:border-github-accent focus:outline-none transition-colors duration-200"
                        required
                    >
                </div>
                <button 
                    type="submit" 
                    id="searchBtn"
                    class="px-6 py-3 bg-github-accent hover:bg-blue-600 text-white font-semibold rounded-lg transition-colors duration-200 flex items-center gap-2"
                >
                    <span>Search</span>
                    <div id="loadingSpinner" class="spinner hidden"></div>
                </button>
            </form>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden mb-6 p-4 bg-red-100 dark:bg-red-900/30 border border-red-400 dark:border-red-700 text-red-700 dark:text-red-300 rounded-lg fade-in">
            <i class="fas fa-exclamation-circle mr-2"></i>
            <span id="errorText"></span>
        </div>

        <!-- Profile Section -->
        <div id="profileSection" class="hidden fade-in">
            <!-- Profile Card -->
            <div class="bg-white dark:bg-github-dark rounded-xl shadow-lg p-6 mb-6 border border-gray-200 dark:border-github-border">
                <div class="flex flex-col md:flex-row gap-6">
                    <!-- Avatar -->
                    <div class="flex-shrink-0">
                        <img 
                            id="avatar" 
                            src="" 
                            alt="Profile Avatar" 
                            class="w-32 h-32 rounded-full border-4 border-github-accent shadow-lg"
                        >
                    </div>
                    
                    <!-- Profile Info -->
                    <div class="flex-1">
                        <h2 id="name" class="text-2xl font-bold mb-1"></h2>
                        <p id="login" class="text-github-accent mb-3"></p>
                        <p id="bio" class="text-gray-600 dark:text-gray-400 mb-4"></p>
                        
                        <div class="flex flex-wrap gap-4 text-sm">
                            <div id="location" class="flex items-center gap-2">
                                <i class="fas fa-map-marker-alt text-gray-500"></i>
                                <span></span>
                            </div>
                            <div id="blog" class="flex items-center gap-2">
                                <i class="fas fa-link text-gray-500"></i>
                                <a href="" target="_blank" class="text-github-accent hover:underline"></a>
                            </div>
                            <div id="company" class="flex items-center gap-2">
                                <i class="fas fa-building text-gray-500"></i>
                                <span></span>
                            </div>
                            <div id="joined" class="flex items-center gap-2">
                                <i class="fas fa-calendar text-gray-500"></i>
                                <span></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Badges -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
                    <div class="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-lg text-center">
                        <div class="text-2xl font-bold text-blue-600 dark:text-blue-400" id="repos">0</div>
                        <div class="text-sm text-gray-600 dark:text-gray-400">Public Repos</div>
                    </div>
                    <div class="bg-purple-50 dark:bg-purple-900/20 p-4 rounded-lg text-center">
                        <div class="text-2xl font-bold text-purple-600 dark:text-purple-400" id="gists">0</div>
                        <div class="text-sm text-gray-600 dark:text-gray-400">Public Gists</div>
                    </div>
                    <div class="bg-green-50 dark:bg-green-900/20 p-4 rounded-lg text-center">
                        <div class="text-2xl font-bold text-green-600 dark:text-green-400" id="followers">0</div>
                        <div class="text-sm text-gray-600 dark:text-gray-400">Followers</div>
                    </div>
                    <div class="bg-orange-50 dark:bg-orange-900/20 p-4 rounded-lg text-center">
                        <div class="text-2xl font-bold text-orange-600 dark:text-orange-400" id="following">0</div>
                        <div class="text-sm text-gray-600 dark:text-gray-400">Following</div>
                    </div>
                </div>
            </div>

            <!-- Repositories Section -->
            <div class="bg-white dark:bg-github-dark rounded-xl shadow-lg p-6 border border-gray-200 dark:border-github-border">
                <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                    <i class="fas fa-book text-github-accent"></i>
                    Top Repositories
                </h3>
                <div id="reposList" class="space-y-4">
                    <!-- Repos will be inserted here -->
                </div>
            </div>
        </div>

        <!-- Initial State -->
        <div id="initialState" class="text-center py-16">
            <i class="fab fa-github text-6xl text-gray-300 dark:text-gray-700 mb-4"></i>
            <p class="text-gray-500 dark:text-gray-400 text-lg">Search for a GitHub user to get started</p>
        </div>
    </div>

    <script>
        // DOM Elements
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const profileSection = document.getElementById('profileSection');
        const initialState = document.getElementById('initialState');
        const themeToggle = document.getElementById('themeToggle');

        // Theme Toggle
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        }

        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });

        initTheme();

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        // Format numbers
        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // Show error
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
            setTimeout(() => {
                errorMessage.classList.add('hidden');
            }, 5000);
        }

        // Hide error
        function hideError() {
            errorMessage.classList.add('hidden');
        }

        // Set loading state
        function setLoading(isLoading) {
            if (isLoading) {
                loadingSpinner.classList.remove('hidden');
                searchBtn.disabled = true;
                searchInput.disabled = true;
            } else {
                loadingSpinner.classList.add('hidden');
                searchBtn.disabled = false;
                searchInput.disabled = false;
            }
        }

        // Get language color
        function getLanguageColor(language) {
            const colors = {
                'JavaScript': '#f1e05a',
                'TypeScript': '#3178c6',
                'Python': '#3572A5',
                'Java': '#b07219',
                'Ruby': '#701516',
                'Go': '#00ADD8',
                'Rust': '#dea584',
                'C++': '#f34b7d',
                'C': '#555555',
                'PHP': '#4F5D95',
                'Swift': '#F05138',
                'Kotlin': '#A97BFF',
                'Dart': '#00B4AB',
                'HTML': '#e34c26',
                'CSS': '#563d7c',
                'Shell': '#89e051',
                'Vue': '#41b883',
                'React': '#61dafb'
            };
            return colors[language] || '#8b949e';
        }

        // Render profile
        function renderProfile(user) {
            document.getElementById('avatar').src = user.avatar_url;
            document.getElementById('name').textContent = user.name || user.login;
            document.getElementById('login').textContent = `@${user.login}`;
            document.getElementById('bio').textContent = user.bio || 'No bio available';
            
            // Location
            const locationEl = document.getElementById('location');
            if (user.location) {
                locationEl.querySelector('span').textContent = user.location;
                locationEl.classList.remove('hidden');
            } else {
                locationEl.classList.add('hidden');
            }
            
            // Blog
            const blogEl = document.getElementById('blog');
            if (user.blog) {
                const blogUrl = user.blog.startsWith('http') ? user.blog : `https://${user.blog}`;
                blogEl.querySelector('a').href = blogUrl;
                blogEl.querySelector('a').textContent = user.blog;
                blogEl.classList.remove('hidden');
            } else {
                blogEl.classList.add('hidden');
            }
            
            // Company
            const companyEl = document.getElementById('company');
            if (user.company) {
                companyEl.querySelector('span').textContent = user.company;
                companyEl.classList.remove('hidden');
            } else {
                companyEl.classList.add('hidden');
            }
            
            // Joined date
            document.getElementById('joined').querySelector('span').textContent = `Joined ${formatDate(user.created_at)}`;
            
            // Stats
            document.getElementById('repos').textContent = formatNumber(user.public_repos);
            document.getElementById('gists').textContent = formatNumber(user.public_gists);
            document.getElementById('followers').textContent = formatNumber(user.followers);
            document.getElementById('following').textContent = formatNumber(user.following);
        }

        // Render repositories
        function renderRepositories(repos) {
            const reposList = document.getElementById('reposList');
            
            if (repos.length === 0) {
                reposList.innerHTML = '<p class="text-gray-500 dark:text-gray-400 text-center py-4">No repositories found</p>';
                return;
            }
            
            reposList.innerHTML = repos.map(repo => `
                <div class="border-b border-gray-200 dark:border-github-border pb-4 last:border-0 last:pb-0">
                    <div class="flex items-start justify-between gap-4">
                        <div class="flex-1">
                            <a href="${repo.html_url}" target="_blank" class="text-github-accent hover:underline font-semibold text-lg">
                                ${repo.name}
                            </a>
                            <p class="text-gray-600 dark:text-gray-400 text-sm mt-1">${repo.description || 'No description available'}</p>
                            <div class="flex flex-wrap items-center gap-4 mt-2 text-sm">
                                ${repo.language ? `
                                    <span class="flex items-center gap-1">
                                        <span class="w-3 h-3 rounded-full" style="background-color: ${getLanguageColor(repo.language)}"></span>
                                        <span class="text-gray-600 dark:text-gray-400">${repo.language}</span>
                                    </span>
                                ` : ''}
                                <span class="flex items-center gap-1 text-gray-600 dark:text-gray-400">
                                    <i class="far fa-star"></i>
                                    ${formatNumber(repo.stargazers_count)}
                                </span>
                                <span class="flex items-center gap-1 text-gray-600 dark:text-gray-400">
                                    <i class="fas fa-code-branch"></i>
                                    ${formatNumber(repo.forks_count)}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Search user
        async function searchUser(username) {
            setLoading(true);
            hideError();
            
            try {
                // Fetch user profile
                const userResponse = await fetch(`https://api.github.com/users/${username}`);
                
                if (!userResponse.ok) {
                    if (userResponse.status === 404) {
                        throw new Error('User not found. Please check the username and try again.');
                    } else if (userResponse.status === 403) {
                        throw new Error('API rate limit exceeded. Please try again later.');
                    } else {
                        throw new Error('An error occurred while fetching user data.');
                    }
                }
                
                const userData = await userResponse.json();
                
                // Fetch repositories
                const reposResponse = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=5`);
                
                if (!reposResponse.ok) {
                    throw new Error('An error occurred while fetching repositories.');
                }
                
                const reposData = await reposResponse.json();
                
                // Render data
                renderProfile(userData);
                renderRepositories(reposData);
                
                // Show profile section
                initialState.classList.add('hidden');
                profileSection.classList.remove('hidden');
                
            } catch (error) {
                showError(error.message);
                profileSection.classList.add('hidden');
                initialState.classList.remove('hidden');
            } finally {
                setLoading(false);
            }
        }

        // Form submit handler
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = searchInput.value.trim();
            if (username) {
                searchUser(username);
            }
        });

        // Focus search input on load
        searchInput.focus();
    </script>
</body>
</html>
