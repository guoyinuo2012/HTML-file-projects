<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* ===== RESET & BASE STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --accent-color: rgba(255, 255, 255, 0.3);
            --error-bg: rgba(220, 38, 38, 0.9);
            --success-bg: rgba(34, 197, 94, 0.9);
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* Default gradient - will be overridden by JS based on weather */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: background 1s ease;
        }

        /* ===== BACKGROUND GRADIENT CLASSES ===== */
        .bg-clear {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
        }

        .bg-clouds {
            background: linear-gradient(135deg, #bdc3c7 0%, #2c3e50 100%);
        }

        .bg-rain {
            background: linear-gradient(135deg, #4b6cb7 0%, #182848 100%);
        }

        .bg-snow {
            background: linear-gradient(135deg, #e6dada 0%, #274046 100%);
        }

        .bg-thunderstorm {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .bg-mist {
            background: linear-gradient(135deg, #757f9a 0%, #d7dde8 100%);
        }

        .bg-default {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* ===== GLASSMORPHISM CONTAINER ===== */
        .dashboard {
            width: 100%;
            max-width: 500px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            padding: 32px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== SEARCH SECTION ===== */
        .search-section {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        .search-input {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--accent-color);
        }

        .search-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .search-btn {
            padding: 14px 24px;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .search-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .geo-btn {
            padding: 14px;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .geo-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .geo-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== ERROR MESSAGE ===== */
        .error-message {
            background: var(--error-bg);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .error-message.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== LOADING SPINNER ===== */
        .loading-container {
            display: none;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
        }

        .loading-container.show {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--text-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== WEATHER CONTENT ===== */
        .weather-content {
            display: none;
        }

        .weather-content.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        /* ===== PRIMARY DISPLAY ===== */
        .primary-display {
            text-align: center;
            margin-bottom: 32px;
        }

        .location {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .country {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .temperature-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .temperature {
            font-size: 72px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1;
        }

        .unit-toggle {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .unit-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .weather-description {
            font-size: 20px;
            color: var(--text-secondary);
            font-weight: 400;
            text-transform: capitalize;
        }

        .weather-icon {
            font-size: 64px;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        /* ===== SECONDARY DETAILS GRID ===== */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .detail-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .detail-icon {
            font-size: 24px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .detail-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 480px) {
            .dashboard {
                padding: 24px;
            }

            .search-section {
                flex-direction: column;
            }

            .search-btn {
                width: 100%;
                justify-content: center;
            }

            .geo-btn {
                width: 100%;
            }

            .temperature {
                font-size: 56px;
            }

            .location {
                font-size: 24px;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 360px) {
            .temperature {
                font-size: 48px;
            }

            .location {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- Search Section -->
        <div class="search-section">
            <input 
                type="text" 
                class="search-input" 
                id="searchInput" 
                placeholder="Search city..."
                autocomplete="off"
            >
            <button class="search-btn" id="searchBtn">
                <i class="bi bi-search"></i>
                Search
            </button>
            <button class="geo-btn" id="geoBtn" title="Use my location">
                <i class="bi bi-geo-alt"></i>
            </button>
        </div>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage"></div>

        <!-- Loading Spinner -->
        <div class="loading-container" id="loadingContainer">
            <div class="spinner"></div>
        </div>

        <!-- Weather Content -->
        <div class="weather-content" id="weatherContent">
            <!-- Primary Display -->
            <div class="primary-display">
                <div class="weather-icon" id="weatherIcon">
                    <i class="bi bi-cloud-sun"></i>
                </div>
                <h1 class="location" id="cityName">London</h1>
                <p class="country" id="countryName">United Kingdom</p>
                
                <div class="temperature-container">
                    <span class="temperature" id="temperature">--</span>
                    <button class="unit-toggle" id="unitToggle">°C</button>
                </div>
                
                <p class="weather-description" id="weatherDescription">Loading...</p>
            </div>

            <!-- Secondary Details Grid -->
            <div class="details-grid">
                <div class="detail-card">
                    <div class="detail-icon">
                        <i class="bi bi-droplet"></i>
                    </div>
                    <div class="detail-label">Humidity</div>
                    <div class="detail-value" id="humidity">--%</div>
                </div>
                
                <div class="detail-card">
                    <div class="detail-icon">
                        <i class="bi bi-wind"></i>
                    </div>
                    <div class="detail-label">Wind Speed</div>
                    <div class="detail-value" id="windSpeed">-- km/h</div>
                </div>
                
                <div class="detail-card">
                    <div class="detail-icon">
                        <i class="bi bi-thermometer-half"></i>
                    </div>
                    <div class="detail-label">Feels Like</div>
                    <div class="detail-value" id="feelsLike">--°</div>
                </div>
                
                <div class="detail-card">
                    <div class="detail-icon">
                        <i class="bi bi-speedometer2"></i>
                    </div>
                    <div class="detail-label">Pressure</div>
                    <div class="detail-value" id="pressure">-- hPa</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== API CONFIGURATION =====
        // Replace 'YOUR_API_KEY_HERE' with your free OpenWeatherMap API key
        // Get your free key at: https://openweathermap.org/api
        const API_KEY = 'YOUR_API_KEY_HERE';
        
        // API Base URL (using OpenWeatherMap)
        const API_BASE_URL = 'https://api.openweathermap.org/data/2.5/weather';

        // ===== STATE MANAGEMENT =====
        let currentWeatherData = null;
        let isCelsius = true;
        let isLoading = false;

        // ===== DOM ELEMENTS =====
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const geoBtn = document.getElementById('geoBtn');
        const errorMessage = document.getElementById('errorMessage');
        const loadingContainer = document.getElementById('loadingContainer');
        const weatherContent = document.getElementById('weatherContent');
        const cityName = document.getElementById('cityName');
        const countryName = document.getElementById('countryName');
        const temperature = document.getElementById('temperature');
        const unitToggle = document.getElementById('unitToggle');
        const weatherDescription = document.getElementById('weatherDescription');
        const weatherIcon = document.getElementById('weatherIcon');
        const humidity = document.getElementById('humidity');
        const windSpeed = document.getElementById('windSpeed');
        const feelsLike = document.getElementById('feelsLike');
        const pressure = document.getElementById('pressure');

        // ===== UTILITY FUNCTIONS =====
        
        /**
         * Convert Kelvin to Celsius
         */
        const kelvinToCelsius = (kelvin) => Math.round(kelvin - 273.15);

        /**
         * Convert Kelvin to Fahrenheit
         */
        const kelvinToFahrenheit = (kelvin) => Math.round((kelvin - 273.15) * 9/5 + 32);

        /**
         * Convert meters per second to km/h
         */
        const mpsToKmh = (mps) => Math.round(mps * 3.6);

        /**
         * Convert meters per second to mph
         */
        const mpsToMph = (mps) => Math.round(mps * 2.237);

        /**
         * Get appropriate weather icon class based on weather condition
         */
        const getWeatherIcon = (weatherMain, weatherId) => {
            const iconMap = {
                'Clear': 'bi-sun',
                'Clouds': weatherId >= 801 ? 'bi-clouds' : 'bi-cloud',
                'Rain': 'bi-cloud-rain',
                'Drizzle': 'bi-cloud-drizzle',
                'Thunderstorm': 'bi-cloud-lightning',
                'Snow': 'bi-snow',
                'Mist': 'bi-cloud-fog',
                'Fog': 'bi-cloud-fog',
                'Haze': 'bi-cloud-haze',
                'Smoke': 'bi-cloud-haze',
                'Dust': 'bi-cloud-haze',
                'Sand': 'bi-cloud-haze',
                'Ash': 'bi-cloud-haze',
                'Squall': 'bi-wind',
                'Tornado': 'bi-tornado'
            };
            return iconMap[weatherMain] || 'bi-cloud';
        };

        /**
         * Get background gradient class based on weather condition
         */
        const getBackgroundClass = (weatherMain) => {
            const bgMap = {
                'Clear': 'bg-clear',
                'Clouds': 'bg-clouds',
                'Rain': 'bg-rain',
                'Drizzle': 'bg-rain',
                'Thunderstorm': 'bg-thunderstorm',
                'Snow': 'bg-snow',
                'Mist': 'bg-mist',
                'Fog': 'bg-mist',
                'Haze': 'bg-mist',
                'Smoke': 'bg-mist',
                'Dust': 'bg-mist',
                'Sand': 'bg-mist',
                'Ash': 'bg-mist',
                'Squall': 'bg-rain',
                'Tornado': 'bg-thunderstorm'
            };
            return bgMap[weatherMain] || 'bg-default';
        };

        /**
         * Show error message to user
         */
        const showError = (message) => {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        };

        /**
         * Set loading state
         */
        const setLoading = (loading) => {
            isLoading = loading;
            searchInput.disabled = loading;
            searchBtn.disabled = loading;
            geoBtn.disabled = loading;
            
            if (loading) {
                loadingContainer.classList.add('show');
                weatherContent.classList.remove('show');
            } else {
                loadingContainer.classList.remove('show');
            }
        };

        /**
         * Update UI with weather data
         */
        const updateUI = (data) => {
            currentWeatherData = data;
            
            // Update primary display
            cityName.textContent = data.name;
            countryName.textContent = data.sys.country;
            weatherDescription.textContent = data.weather[0].description;
            
            // Update weather icon
            const iconClass = getWeatherIcon(data.weather[0].main, data.weather[0].id);
            weatherIcon.innerHTML = `<i class="bi ${iconClass}"></i>`;
            
            // Update temperature based on current unit
            updateTemperatureDisplay();
            
            // Update secondary details
            humidity.textContent = `${data.main.humidity}%`;
            windSpeed.textContent = isCelsius 
                ? `${mpsToKmh(data.wind.speed)} km/h`
                : `${mpsToMph(data.wind.speed)} mph`;
            feelsLike.textContent = isCelsius 
                ? `${kelvinToCelsius(data.main.feels_like)}°`
                : `${kelvinToFahrenheit(data.main.feels_like)}°`;
            pressure.textContent = `${data.main.pressure} hPa`;
            
            // Update background gradient
            const bgClass = getBackgroundClass(data.weather[0].main);
            document.body.className = bgClass;
            
            // Show weather content
            weatherContent.classList.add('show');
        };

        /**
         * Update temperature display based on current unit
         */
        const updateTemperatureDisplay = () => {
            if (!currentWeatherData) return;
            
            const temp = isCelsius 
                ? kelvinToCelsius(currentWeatherData.main.temp)
                : kelvinToFahrenheit(currentWeatherData.main.temp);
            
            temperature.textContent = temp;
            unitToggle.textContent = isCelsius ? '°C' : '°F';
            
            // Update feels like display as well
            feelsLike.textContent = isCelsius 
                ? `${kelvinToCelsius(currentWeatherData.main.feels_like)}°`
                : `${kelvinToFahrenheit(currentWeatherData.main.feels_like)}°`;
            
            // Update wind speed unit
            windSpeed.textContent = isCelsius 
                ? `${mpsToKmh(currentWeatherData.wind.speed)} km/h`
                : `${mpsToMph(currentWeatherData.wind.speed)} mph`;
        };

        /**
         * Save city to localStorage
         */
        const saveLastCity = (city) => {
            localStorage.setItem('lastWeatherCity', city);
        };

        /**
         * Get last city from localStorage
         */
        const getLastCity = () => {
            return localStorage.getItem('lastWeatherCity');
        };

        /**
         * Fetch weather data by city name
         */
        const fetchWeatherByCity = async (city) => {
            if (isLoading) return;
            
            if (!API_KEY || API_KEY === 'YOUR_API_KEY_HERE') {
                showError('Please add your OpenWeatherMap API key in the source code.');
                return;
            }
            
            setLoading(true);
            errorMessage.classList.remove('show');
            
            try {
                const url = `${API_BASE_URL}?q=${encodeURIComponent(city)}&appid=${API_KEY}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('City not found. Please check the spelling and try again.');
                    } else if (response.status === 401) {
                        throw new Error('Invalid API key. Please check your API key configuration.');
                    } else {
                        throw new Error(`API error: ${response.status}`);
                    }
                }
                
                const data = await response.json();
                updateUI(data);
                saveLastCity(city);
                
            } catch (error) {
                if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    showError('Network error. Please check your internet connection.');
                } else {
                    showError(error.message);
                }
            } finally {
                setLoading(false);
            }
        };

        /**
         * Fetch weather data by coordinates
         */
        const fetchWeatherByCoords = async (lat, lon) => {
            if (isLoading) return;
            
            if (!API_KEY || API_KEY === 'YOUR_API_KEY_HERE') {
                showError('Please add your OpenWeatherMap API key in the source code.');
                return;
            }
            
            setLoading(true);
            errorMessage.classList.remove('show');
            
            try {
                const url = `${API_BASE_URL}?lat=${lat}&lon=${lon}&appid=${API_KEY}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }
                
                const data = await response.json();
                updateUI(data);
                saveLastCity(data.name);
                
            } catch (error) {
                if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    showError('Network error. Please check your internet connection.');
                } else {
                    showError(error.message);
                }
            } finally {
                setLoading(false);
            }
        };

        /**
         * Get user's current location
         */
        const getCurrentLocation = () => {
            if (!navigator.geolocation) {
                showError('Geolocation is not supported by your browser.');
                return;
            }
            
            setLoading(true);
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const { latitude, longitude } = position.coords;
                    fetchWeatherByCoords(latitude, longitude);
                },
                (error) => {
                    setLoading(false);
                    switch (error.code) {
                        case error.PERMISSION_DENIED:
                            showError('Location permission denied. Please enable location access.');
                            break;
                        case error.POSITION_UNAVAILABLE:
                            showError('Location information is unavailable.');
                            break;
                        case error.TIMEOUT:
                            showError('Location request timed out.');
                            break;
                        default:
                            showError('An unknown error occurred getting your location.');
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        };

        // ===== EVENT LISTENERS =====
        
        // Search button click
        searchBtn.addEventListener('click', () => {
            const city = searchInput.value.trim();
            if (city) {
                fetchWeatherByCity(city);
            } else {
                showError('Please enter a city name.');
            }
        });

        // Enter key in search input
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const city = searchInput.value.trim();
                if (city) {
                    fetchWeatherByCity(city);
                } else {
                    showError('Please enter a city name.');
                }
            }
        });

        // Geolocation button click
        geoBtn.addEventListener('click', getCurrentLocation);

        // Unit toggle click
        unitToggle.addEventListener('click', () => {
            isCelsius = !isCelsius;
            updateTemperatureDisplay();
        });

        // ===== INITIALIZATION =====
        
        /**
         * Initialize the app
         */
        const init = () => {
            const lastCity = getLastCity();
            
            if (lastCity) {
                // Load last searched city
                fetchWeatherByCity(lastCity);
            } else {
                // Default to London
                fetchWeatherByCity('London');
            }
        };

        // Start the app when DOM is ready
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
